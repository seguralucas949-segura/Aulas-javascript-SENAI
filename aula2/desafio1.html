<body>
    <h1><mark> ELEMENTOS (TAGS)</mark>DO HTML ATRAVÉS DO JAVASCRIPT </h1>
    <div>
        <p>Estamos aprendendo javascript</p>

        <p> Aprender é muiro legal!!</p>

        <p> E para ajudar o aprendizado, é PRECISO praticar e exercitar </p>
    </div>
    <script>
        const tags_p = document.getElementsByTagName('p')
        console.log(tags_p);
        let tag_p_1 = tags_p[0];

        tag_p_1.style.backgroundColor = "purple";
        tag_p_1.style.color = "white";
        tag_p_1.style.textAlign = "center";

        let tag_p_2 = tags_p[1];
        console.log(tag_p_2);
        tag_p_2.style.backgroundColor = "red";
        tag_p_2.style.color = "white";
        tag_p_2.style.textAlign = "center";


        let tag_p_3 = tags_p[2];
        console.log(tags_p);
        tag_p_3.style.backgroundColor = "blue";
        tag_p_3.style.color = "white";
        tag_p_3.style.textAlign = "center";


        tag_p_3.innerHTML = "ALTEREI O CONTEÚDO";
        tag_p_2.innerText = "MUDEI"
        const tag_body = document.getElementsByTagName('body');
        console.log(tag_body);
        tag_body[0].style.backgroundColor = "gray";

        tag_body[0].style.border = "10px solid black";

        const tag_div = document.getElementsByTagName('div');
        console.log(tag_div);
        tag_div[0].style.backgroundColor = "blue";

        const tag_h1 = document.getElementsByTagName('h1');
        console.log(tag_h1);
        tag_h1[0].style.color = "white";
        tag_h1[0].style.textAlign = "center";

        
        


    </script>
