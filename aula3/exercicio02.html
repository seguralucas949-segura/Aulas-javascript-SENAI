<body>
    <h1> integrando os recursos de interativaidade do JS</h1>
    <hr>

    <form>
        <input type="number" name="numero1" id="numero1" placeholder="Digite o primeiro número">
        <input type="number" name="numero2" id="numero2" placeholder="Digite o segundo número">
        <button type="button" onclick="calcular()">Somar</button>
    </form>
    <p id="resposta"></p>
    <script>
        function calcular() {
            let num1 = document.getElementById("numero1");
            let num2 = document.getElementById("numero2");
            console.log(num1.value);

            if (document.getElementById("numero1").value == "Somar") {
                resposta = parseFloat(num1.value) + parseFloat(num2.value);
            } else {
                resposta = parseFloat(num1.value) + parseFloat(num2.value);
            }
            document.getElementById("resposta").innerHTML = "O resultado da operação é: " + resposta;
        }




    </script>
